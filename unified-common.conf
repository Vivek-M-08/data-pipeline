# =====================================================
# ENVIRONMENT CONFIGURATION
# =====================================================
job.env = "local"
job.bb = "elevate"
job.enable.distributed.checkpointing = false
job.statebackend.blob.storage.account = "blob.storage.account"
job.statebackend.blob.storage.container = "kp-checkpoints"
job.statebackend.blob.storage.checkpointing.dir = "flink-jobs"
job.statebackend.base.url = "file:///opt/flink/checkpoints"


# =====================================================
# KAFKA CONFIGURATION
# =====================================================
kafka.broker.servers = "kafka:9092"
kafka.zookeeper = "zookeeper:2181"
kafka.groupId = "test-consumer-group" #check and remove if not required
kafka.auto.offset.reset = "earliest"
kafka.producer.max-request-size = 102400

task.checkpointing.compressed = true
task.checkpointing.pause.between.seconds = 30000
task.checkpointing.interval = 60000
task.restart-strategy.attempts = 1
task.restart-strategy.delay = 10000
task.parallelism = 1
task.consumer.parallelism = 1


# =====================================================
# AKKA CONFIGURATION
# =====================================================
akka.http.host = "localhost"
akka.http.port = 8080
akka.http.vivek = "vivek is watching the flow"
akka.http.server.request-timeout = 60s
akka.http.server.idle-timeout = 60s
akka.file.sinkDirectory = "{file.sinkDirectory}"
akka.security.api.token = "{your-api-token}"
akka.debug.logs = "true"

# Dedicated dispatcher for blocking I/O operations (Kafka, etc.)
blocking-io-dispatcher {
  type = Dispatcher
  executor = "thread-pool-executor"
  thread-pool-executor {
    fixed-pool-size = 4
  }
  throughput = 1
} # PUT THIS IN SINGLE LINE

# =====================================================
# FLINK CONFIGURATION
# =====================================================
flink.url = "https://flink-qa.tekdinext.com"
flink.jobs = [ "MetabaseProjectDashboardJob", "ProjectsStreamJob", "SurveysStreamJob", "MetabaseSurveyDashboardJob", "UserAndProgramManagement", "ObservationsStreamJob", "MetabaseObservationDashboardJob", "UsersStreamJob", "MentoringStreamJob", "MetabaseUserDashboardJob", "MetabaseMentoringDashboardJob" ]


# =====================================================
# POSTGRES CONFIGURATION
# =====================================================
postgres.host = "{host}"
postgres.port = "{port}"
postgres.username = "{username}"
postgres.password = "{password}"
postgres.database = "{database}"    #This is the default database where flattened data will be stored.
postgres.metabaseDb = "{metabase}"    #This is the database where metabase creates and stores the collection users etc.
postgres.tables.solutionsTable = ${job.env}"_solutions"
postgres.tables.projectsTable = ${job.env}"_projects"
postgres.tables.tasksTable = ${job.env}"_tasks"
postgres.tables.dashboardMetadataTable = ${job.env}"_dashboard_metadata"
postgres.tables.reportConfigTable = ${job.env}"_report_config"
postgres.tables.userMetrics = ${job.env}"_user_metrics"


# =====================================================
# METABASE CONFIGURATION
# =====================================================
metabase.url = "http://localhost:3000/api"
metabase.username = "{metabase-username}"
metabase.password = "{metabase-password}"
metabase.database = "{database}"    #This is the name from the Metabase UI while adding a new database connection.
metabase.domainName = "http://localhost:3000/dashboard/"
metabase.api.key = "d3f4ult-api-key"
metabase.evidenceBaseUrl = "https://elevate-api.sunbirdsaas.com/project/v1/cloud-services/files/download?file="


# =====================================================
# PROJECT CONFIGURATION
# =====================================================
kafka.project.stream.input.topic = "sl-improvement-project-submission-dev"
kafka.project.stream.output.topic = "sl-metabase-project-dashboard-dev"
kafka.project.stream.groupId = "sl-improvement-project-consumer-group-dev"
kafka.project.dashboard.input.topic = "sl-metabase-project-dashboard-dev"
kafka.project.dashboard.groupId = "sl-metabase-project-dashboard-consumer-group-dev"

task.project.stream.consumer.parallelism = 1
task.project.stream.parallelism = 1
task.project.dashboard.parallelism = 1
task.project.metabase.dashboard.parallelism = 1

project.reports.enabled = ["admin", "state", "district", "program", "solution"]

# =====================================================
# SURVEY CONFIGURATION
# =====================================================
kafka.survey.stream.input.topic = "elevate_surveys_raw_dev"
kafka.survey.stream.output.topic = "sl-metabase-survey-dashboard-dev"
kafka.survey.stream.groupId = "elevate-survey-raw-consumer-group-dev"
kafka.survey.dashboard.input.topic = "sl-metabase-survey-dashboard-dev"
kafka.survey.dashboard.groupId = "sl-metabase-survey-dashboard-consumer-group-dev"

task.survey.stream.consumer.parallelism = 1
task.survey.stream.parallelism = 1
task.survey.dashboard.parallelism = 1
task.survey.metabase.dashboard.parallelism = 1

survey.reports.enabled = ["admin", "program", "solution"]


# =====================================================
# OBSERVATION CONFIGURATION
# =====================================================
kafka.observation.stream.input.topic = "elevate_observations_dev"
kafka.observation.stream.output.topic = "sl-metabase-observation-dashboard-dev"
kafka.observation.stream.groupId = "elevate-observations-consumer-group-dev"
kafka.observation.dashboard.input.topic = "sl-metabase-observation-dashboard-dev"
kafka.observation.dashboard.groupId = "sl-metabase-observation-dashboard-consumer-group-dev"

task.observation.stream.consumer.parallelism = 1
task.observation.stream.parallelism = 1
task.observation.dashboard.parallelism = 1
task.observation.metabase.dashboard.parallelism = 1

observation.reports.enabled = ["admin", "program", "solution"]


# =====================================================
# MENTORING CONFIGURATION
# =====================================================
kafka.mentoring.stream.input.topic = "dev.mentoringCreate"
kafka.mentoring.stream.output.topic = "sl-metabase-mentoring-dashboard-dev"
kafka.mentoring.stream.groupId = "dev.mentoring"
kafka.mentoring.dashboard.input.topic = "sl-metabase-mentoring-dashboard-dev"
kafka.mentoring.dashboard.groupId = "sl-metabase-mentoring-dashboard-consumer-group-dev"

task.mentoring.stream.consumer.parallelism = 1
task.mentoring.stream.parallelism = 1
task.mentoring.dashboard.parallelism = 1
task.mentoring.metabase.dashboard.parallelism = 1


# =====================================================
# USER SERVICE CONFIGURATION
# =====================================================
#user-stream-processor
kafka.user.stream.input.topic = "dev.userCreate"
kafka.user.stream.output.topic = "sl-metabase-user-dashboard-dev"
kafka.user.stream.groupId = "dev.users"
kafka.user.stream.output.mentoring.topic = "sl-metabase-mentoring-dashboard-dev"
#user-dashboard-creator
kafka.user.dashboard.input.topic = "sl-metabase-user-dashboard-dev"
kafka.user.dashboard.groupId = "sl-metabase-user-dashboard-consumer-group-dev"
#user-to-dashboard-mapper
kafka.user.map.input.topic.one = "dev.userCreate"
kafka.user.map.input.topic.two = "dev.program"
kafka.user.map.groupId = "dev.users"
kafka.user.map.output.topic = "develop.notifications"

#user-stream-processor
task.user.stream.consumer.parallelism = 1
task.user.stream.parallelism = 1
task.user.dashboard.parallelism = 1
#user-dashboard-creator
task.user.metabase.dashboard.parallelism = 1
#user-to-dashboard-mapper
task.user.map.user.service.parallelism = 1
task.user.map.program.service.parallelism = 1
task.user.map.notification.parallelism = 1

user.map.domain.name = "@elevate-saas.com"
user.map.notify.type = "api"
user.map.notify.api.url = "https://saas-qa-interface.tekdinext.com/interface/v1/notification/send-raw"
user.map.notify.email.template = """ {"email":{"to":["{email}"],"subject":"Welcome to Metabase Analytics Platform","body":"<p>Dear {name},</p><p>Please find the URL and login credentials for Metabase.</p><p>URL: <a href=\"{dashboardLink}\">Click here to access Metabase</a></p><p>Username: {email}</p><p>Password: {password}</p>"}} """
user.map.notify.sms.template = """ {"sms":{"to":["{mobile}"],"body":"Dear {name},\nPlease find the URL and login credentials for Metabase.\nURL: {dashboardLink}\nUsername: {email}\nPassword: {password}"}} """

# =====================================================
# ELEVATE DATA ENTRYPOINT CONFIGURATION
# =====================================================
health.check.interval.sec = 60
health.check.job-jars = {"MetabaseProjectDashboardJob":"/app/metabase-jobs/project-dashboard-creator/target/project-dashboard-creator-1.0.0.jar","ProjectsStreamJob":"/app/stream-jobs/project-stream-processor/target/project-stream-processor-1.0.0.jar","UserAndProgramManagement":"/app/metabase-jobs/user-service/target/user-service-1.0.0.jar","ObservationsStreamJob":"/app/stream-jobs/observation-stream-processor/target/observation-stream-processor-1.0.0.jar","MetabaseObservationDashboardJob":"/app/metabase-jobs/observation-dashboard-creator/target/observation-dashboard-creator-1.0.0.jar"}
health.check.job-conf = ["/app/unified-common.conf"]
health.check.akka-jar = "/app/akka-service/target/akka-service-1.0.0.jar"

# =====================================================
# DATA CLEANUP CONFIGURATION
# =====================================================
kafka.resource.delete.topic = "sl-resource-delete-dev"
kafka.resource.delete.groupId = "sl-resource-delete-consumer-group-dev"
data.cleanup.enabled = true
data.cleanup.log.path = "/home/user2/vivek-elevate-data/viveks-data-pipeline/logs/data-cleanup.log"


